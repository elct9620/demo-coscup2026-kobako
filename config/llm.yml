# 本地 LMStudio（OpenAI 相容）連線設定，由 config_for(:llm) 載入。
# 預設值供開發使用；部署時以對應 ENV 覆寫端點、金鑰與模型。
# 各環境差異僅在 ENV，故集中於 shared；如未來需環境專屬值，可加 development/production 段。
shared:
  api_base: "<%= ENV.fetch("LLM_API_BASE", "http://localhost:1234/v1") %>"
  api_key: "<%= ENV.fetch("LLM_API_KEY", "lm-studio") %>"
  model: "<%= ENV.fetch("LLM_MODEL", "google/gemma-4-26b-a4b-qat") %>" # 預設 LMStudio 模型，可用 ENV 覆寫
