<!doctype html>
<html lang="zh-Hant">
  <head>
    <title>404 — page not found</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      /* Self-contained: error pages must render with no app assets or web
         fonts. Mirrors the Lab Notebook system — cool paper, Kon navy, sharp
         corners, mono — using the system font stack. */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      :root {
        --paper: #f7fafe;
        --ink: #393d43;
        --ink-strong: #14161a;
        --muted: #696f77;
        --navy: #0f2540;
        --edge: #dce0e5;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(100%, 32rem);
        border: 1px solid var(--edge);
        background: #fff;
        padding: 2.5rem;
      }
      .code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.875rem;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      h1 {
        margin-top: 0.5rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink-strong);
        text-wrap: balance;
      }
      p { margin-top: 0.75rem; color: var(--ink); }
      p.sub { color: var(--muted); }
      a.back {
        display: inline-block;
        margin-top: 1.5rem;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.875rem;
        color: var(--navy);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a.back:hover { text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">HTTP 404</p>
      <h1>This page doesn't exist</h1>
      <p>你要找的頁面不存在 — 可能是網址打錯，或該端點尚未生成。</p>
      <p class="sub">If you're the operator, check the logs for more.</p>
      <a class="back" href="/">← Back to the generator</a>
    </main>
  </body>
</html>
